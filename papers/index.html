---
layout: default
title: Papers
description: "Papers of the lab"
group: navigation
navorder: 1
---
{% assign years = site.categories.papers | group_by: "year" %}
{% for year in years %}
<h1{% if forloop.first %} class="pt-20"{% endif %}>{{ year.name }}</h1>
<hr class="year-rule">
<div class="columns-3-lg">
  {% for paper in year.items %}
  <div class="paper-item">
    <div class="smallhead"><a href="{{ paper.url }}" class="off">{{ paper.title }}</a></div>
    <p class="note">{{ paper.ref }}</p>
  </div>
  {% endfor %}
</div>
{% endfor %}
