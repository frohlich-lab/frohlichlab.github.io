# Post URLs are /<category>/<slug>, e.g. /papers/frohlich-amici-simulation
# (no date; spaces in file names become hyphens).
# For more see: https://jekyllrb.com/docs/permalinks/
permalink: /:categories/:title

exclude: ["README.md", "Gemfile", "Gemfile.lock", "vendor", "node_modules", "venv"]
highlighter: rouge

# Match the settings the github-pages gem used to apply
future: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# jekyll-redirect-from would otherwise publish an (empty) /redirects.json
redirect_from:
  json: false

repository: frohlich-lab/frohlichlab.github.io

# Used for absolute URLs (feed, sitemap).
url: https://www.frohlichlab.com
baseurl: ""

title : Fröhlich Lab
tagline: Dynamics of Living Systems Lab
institution:
  url: https://www.crick.ac.uk
  name: The Francis Crick Institute
author :
  name : Fabian Fröhlich
  email : fabian.frohlich@crick.ac.uk
  github : ffroehlich

# Papers are generated from this BibTeX file by _plugins/papers.rb
papers:
  bibliography: papers/_posts/bibliography.bib
  pdf_dir: assets/pdfs/papers
