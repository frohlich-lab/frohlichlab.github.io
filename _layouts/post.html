---
layout: default
---
<div class="page-header">
  <h1>{{ page.title }}</h1>
</div>

<div class="split split-narrow">
  <div class="note pt-20 pb-20">
    <div class="smallhead">
      {{ page.date | date_to_string }}
    </div>
  </div>
  <div class="note pt-20">
    <div class="content">
      {{ content }}
    </div>
  </div>
</div>

<hr>
