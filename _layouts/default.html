<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <meta name="author" content="{{ site.author.name }}">

    <link rel="stylesheet" href="/assets/themes/lab/css/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,700;1,300;1,700&display=swap">

    <link rel="shortcut icon" href="/assets/themes/lab/images/logo/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/themes/lab/images/logo/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/themes/lab/images/logo/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/themes/lab/images/logo/favicon-16x16.png">
    <link rel="manifest" href="/assets/themes/lab/images/logo/site.webmanifest">

    <link href="/atom.xml" type="application/atom+xml" rel="alternate" title="{{ site.title }}: News and Blog">

    <script>document.documentElement.classList.add('js');</script>
  </head>

  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-logo" href="/">
          <img src="/assets/themes/lab/images/logo/lab-logo.png" alt="{{ site.title }} home" width="50" height="50">
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="visually-hidden">Toggle navigation</span>
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Main">
          <a class="site-brand" href="/">{{ site.title }}</a>
          <ul class="bar-links">
            {% assign nav_pages = site.pages | where: "group", "navigation" | sort: "navorder" %}
            {% for node in nav_pages %}
            <li><a href="{{ node.url }}"{% if page.url == node.url %} aria-current="page"{% endif %}>{{ node.title }}</a></li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </header>

    <main class="container site-main" id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <ul class="bar-links">
          <li><a href="{{ site.institution.url }}">{{ site.institution.name }}</a></li>
        </ul>
        <ul class="bar-links">
          <li><a href="/about.html#purpose">About</a></li>
          <li><a href="/join.html">Join</a></li>
        </ul>
      </div>
    </footer>

    <script>
      (function () {
        var toggle = document.querySelector('.nav-toggle');
        var nav = document.getElementById('site-nav');
        function setOpen(open) {
          toggle.setAttribute('aria-expanded', open);
          nav.classList.toggle('is-open', open);
        }
        toggle.addEventListener('click', function () {
          setOpen(toggle.getAttribute('aria-expanded') !== 'true');
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && nav.classList.contains('is-open')) {
            setOpen(false);
            toggle.focus();
          }
        });
      })();
    </script>
  </body>
</html>
